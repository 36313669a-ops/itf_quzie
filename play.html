<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家答題</title><link rel="stylesheet" href="/css/style.css"></head><body><header class="topbar"><div class="brand">玩家答題</div><a href="/">首頁</a></header><main class="wrap narrow">
<section id="joinCard" class="card"><h1>加入遊戲</h1><label>六位數遊戲代碼</label><input id="gameCode" inputmode="numeric" maxlength="6" placeholder="例如 583214"><label>你的暱稱</label><input id="nickname" maxlength="18" placeholder="輸入暱稱"><button class="btn" id="joinBtn" style="margin-top:14px;width:100%">加入遊戲</button><div id="joinNotice" class="notice"></div></section>
<section id="playCard" class="card hidden"><div class="row"><span class="pill" id="playerBadge"></span><span class="pill" id="playerScore">0 分</span></div><h1 id="playQuestion">等待主持人開始……</h1><div id="playTimer" class="timer"></div><div id="playOptions" class="answers"></div><div id="playNotice" class="notice">已加入，請等待主持人出題。</div></section></main><script type="module" src="/js/play.js"></script></body></html>
