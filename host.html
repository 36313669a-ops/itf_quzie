<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主持人控制台</title><link rel="stylesheet" href="/css/style.css"></head><body>
<header class="topbar"><div class="brand">主持人控制台</div><nav><a href="/">首頁</a><a href="/admin.html">題庫管理</a></nav></header><main class="wrap"><div class="card narrow"><h1>主持人登入</h1><label>Email</label><input id="email" type="email"><label>密碼</label><input id="password" type="password"><div class="row" style="margin-top:12px"><button class="btn" id="loginBtn">登入</button><button class="btn secondary" id="logoutBtn">登出</button></div><div id="notice" class="notice"></div></div>
<section id="controlPanel" class="hidden"><div class="card"><h2>建立遊戲場次</h2><label>本場題目</label><select id="quizSelect"></select><button class="btn" id="createGameBtn" style="margin-top:12px">建立新場次</button><p class="muted">第一版會依題庫目前順序使用全部題目。</p><div id="gameInfo" class="notice"></div></div>
<div class="card"><h2>遊戲控制</h2><p>遊戲代碼：<strong id="activeCode">尚未建立</strong>　玩家人數：<strong id="playerCount">0</strong></p><p>目前狀態：<span id="gameStatus" class="pill">尚未開始</span></p><div class="row"><button class="btn" id="startBtn" disabled>開始／重新開放本題</button><button class="btn secondary" id="stopBtn" disabled>結束本題</button><button class="btn secondary" id="nextBtn" disabled>下一題</button></div><p><a id="displayLink" target="_blank" rel="noopener">開啟投影畫面</a></p><p><a id="playerLink" target="_blank" rel="noopener">玩家加入網址</a></p><div id="controlNotice" class="notice"></div></div>
<div class="card"><h2>本題作答統計</h2><div id="stats" class="muted">尚無作答資料</div></div><div class="card"><h2>即時排行榜</h2><div id="leaderboard"></div></div></section></main>
<script type="module" src="/js/host.js"></script></body></html>
